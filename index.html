<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Panel Estadístico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./Estilo/estilo3d.css">
</head>
<body class="bg-dashboard">

    <div class="container-xl my-4 my-md-5 px-3">
        <div class="card shadow-lg border-0 p-3 p-sm-4 main-dashboard-card">
            
            <div class="text-center mb-4">
                <h3 class="fw-bold text-dark d-flex align-items-center justify-content-center gap-2 dashboard-title">
                    <i class="bi bi-bar-chart-steps text-primary"></i> PANEL DE DATOS 
                </h3>
                <hr class="text-muted opacity-25">
            </div>

            <div class="card border border-light-subtle p-3 p-sm-4 bg-panel-inputs rounded-4 mb-4">
                <h5 class="fw-bold text-secondary mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-gear-fill text-muted"></i> Configuración de Datos
                </h5>
                
                <div class="row g-3 g-md-4">
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold text-dark mb-2">
                            <i class="bi bi-tags-fill me-1 text-primary"></i> Categorías (separadas por comas):
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill border-2 px-3">
                                <i class="bi bi-tag text-muted"></i>
                            </span>
                            <input type="text" id="labelsInput" class="form-control border-start-0 rounded-end-pill border-2 ps-2" value="Enero, Febrero, Marzo, Abril, Mayo">
                        </div>
                    </div>
                    
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold text-dark mb-2">
                            <i class="bi bi-input-cursor-text me-1 text-primary"></i> Valores (separados por comas):
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill border-2 px-3">
                                <i class="bi bi-123 text-muted"></i>
                            </span>
                            <input type="text" id="valuesInput" class="form-control border-start-0 rounded-end-pill border-2 ps-2" value="120, 205, 180, 400, 310">
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button id="btnGraficar" class="btn btn-primary w-100 w-sm-auto px-5 py-2 fw-bold rounded-pill btn-action shadow-sm">
                        <i class="bi bi-play-fill me-1"></i> Generar Gráfico
                    </button>
                </div>
            </div>

            <div class="card border border-light-subtle p-3 p-sm-4 rounded-4 bg-white">
                <h5 class="fw-bold text-dark text-start mb-3">Visualización del Gráfico 3D</h5>
                
                <div class="canvas-responsive-wrapper">
                    <canvas id="canvasBarras3D" width="800" height="480"></canvas>
                </div>
            </div>

            <div class="text-center mt-4">
                <span class="text-muted small fw-medium tracking-wide"></span>
            </div>

        </div>
    </div>

    <script src="./DistSRC/index.js" type="module"></script>
</body>
</html>
