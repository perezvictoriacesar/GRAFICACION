<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graficador de Funciones Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Estilo/index.css">
  </head>
  <body class="bg-light">
    
    <nav class="navbar navbar-dark bg-primary shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Graficador De Funciones</a>
      </div>
    </nav>

    <div class="container my-4 text-center">
      <div class="card p-4 shadow-sm mx-auto mb-4" style="max-width: 750px;">
        <div class="row g-3 align-items-center justify-content-center">
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text bg-primary text-white fw-bold">f(x) =</span>
              <input type="text" id="funcInput" class="form-control" value="Math.sin(x)">
            </div>
          </div>
          <div class="col-md-6 d-flex gap-2">
            <button class="btn btn-primary fw-bold flex-grow-1" type="button" id="btnDibujar">Graficar</button>
            <button class="btn btn-outline-secondary" type="button" id="btnZoomIn">Zoom +</button>
            <button class="btn btn-outline-secondary" type="button" id="btnZoomOut">Zoom -</button>
          </div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="circlechart" width="640" height="480" class="border rounded bg-white"></canvas>
      </div>
    </div>

    <script src="./DistSRC/index.js" type="module"></script>
  </body>
</html>
